name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The embedding model is a ~128MB download that every test run of
      # adapters-fastembed would otherwise repeat.
      - uses: actions/cache@v4
        with:
          path: crates/adapters-fastembed/.fastembed_cache
          key: fastembed-${{ runner.os }}-${{ hashFiles('crates/adapters-fastembed/src/lib.rs') }}
          restore-keys: fastembed-${{ runner.os }}-

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace
