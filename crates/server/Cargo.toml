[package]
name = "server"
version.workspace = true
edition.workspace = true

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "synapse-server"
path = "src/main.rs"

[dependencies]
adapters-fastembed = { path = "../adapters-fastembed" }
adapters-sqlite = { path = "../adapters-sqlite" }
api = { path = "../api", features = ["server"] }
axum = "0.8"
domain = { path = "../domain" }
humantime = "2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
