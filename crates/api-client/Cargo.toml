[package]
name = "api-client"
version.workspace = true
edition.workspace = true

[dependencies]
api = { path = "../api" }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
