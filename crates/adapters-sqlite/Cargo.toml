[package]
name = "adapters-sqlite"
version.workspace = true
edition.workspace = true

[dependencies]
domain = { path = "../domain" }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
