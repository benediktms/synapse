services:
  synapse:
    build: .
    image: synapse-server:local
    container_name: synapse-server
    # The bind-mounted ./data is owned by whoever created it; run as that user rather
    # than relying on the runtime to fudge ownership for the image's `synapse` uid.
    user: "${SYNAPSE_UID:-10001}:${SYNAPSE_GID:-10001}"
    environment:
      SYNAPSE_TOKEN: ${SYNAPSE_TOKEN:?set SYNAPSE_TOKEN before starting the stack}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:8737:8737"
    volumes:
      - ./data:/data
    stop_grace_period: 5s
